# Debug the evaluation on the local Ollama model: no GPU and no API key. Only "base" and
# "prompt" exist here (the LoRA is not in Ollama), every LLM role is the local 4B model,
# and outputs go to data/eval_local. The numbers mean nothing; this only checks the code.
inherit: pipeline.yaml
roles:
  prompt_writer: {endpoint: ollama, model: qwen3:4b-instruct, temperature: 1.0, max_tokens: 1200, concurrency: 4}
  user_sim: {endpoint: ollama, model: qwen3:4b-instruct, temperature: 0.9, max_tokens: 150, concurrency: 4}
  judge: {endpoint: ollama, model: qwen3:4b-instruct, temperature: 0.0, max_tokens: 400, concurrency: 4}
  judge2: {endpoint: ollama, model: qwen3:4b-instruct, temperature: 0.0, max_tokens: 400, concurrency: 4}
eval:
  dir: data/eval_local
  systems:
    base: {endpoint: ollama, model: qwen3:4b-instruct, system_prompt: false}
    prompt: {endpoint: ollama, model: qwen3:4b-instruct, system_prompt: true}
  sampling: {temperature: 0.7, top_p: 0.8, max_tokens: 512, concurrency: 4}
  multiturn_turns: 3
  pivot_per_category: 1
  judges: [judge, judge2]
