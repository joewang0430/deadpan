[project]
name = "deadpan"
version = "0.1.0"
description = "Deadpan: a sarcastic persona in the weights (LoRA) vs. in the prompt, on a small local LLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "nltk>=3.9.1",
    "langdetect>=1.0.9",
    "immutabledict>=4.3.1",
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_lora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
